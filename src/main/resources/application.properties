jobrunr.background-job-server.enabled=true
# a modest worker count keeps an invoice run going long enough to watch it
jobrunr.background-job-server.worker-count=20
jobrunr.dashboard.enabled=true

spring.datasource.url=jdbc:h2:mem:jobrunr;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver

# Note: the poll interval is 15 seconds by default, so a freshly enqueued job can sit in ENQUEUED
# for a few seconds before a worker picks it up. That is the long blue bar in the article's screenshot.
